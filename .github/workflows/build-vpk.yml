name: Build VPK

on:
  workflow_dispatch:
    inputs:
      publish_test:
        description: '发布为测试版 Release（取消则仅生成 Artifact）'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-vpk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.event_name == 'workflow_dispatch'
    name: Package and verify (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      # The upstream release tag for the locally used 5.0.0 beta 4.
      VPKEDIT_TAG: v5.0.0.4
      VPKEDIT_SHA256: 66fdc296d637afb771723134a35e8bf532eebd98fb7479dc33b37701b165b981
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install official VPKEdit Linux CLI
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/vpkedit-linux.zip"
          tool_dir="$RUNNER_TEMP/vpkedit"
          curl --fail --location --retry 3 \
            "https://github.com/craftablescience/VPKEdit/releases/download/${VPKEDIT_TAG}/VPKEdit-Linux-Standalone-gcc-Release.zip" \
            --output "$archive"
          printf '%s  %s\n' "$VPKEDIT_SHA256" "$archive" | sha256sum --check
          mkdir -p "$tool_dir"
          unzip -q "$archive" -d "$tool_dir"
          chmod +x "$tool_dir/vpkeditcli"
          "$tool_dir/vpkeditcli" --help
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Validate addon sources
        run: |
          python -X utf8 scripts/validate_addon.py
          python -X utf8 -m unittest discover -s tests -p 'test_item_resources.py' -v
          python -X utf8 -m unittest discover -s tests -p 'test_release_vpk.py' -v
          python -X utf8 -m unittest discover -s tests -p 'test_multiplayer_profile.py' -v

      - name: Exercise mapped packaging and verification
        shell: pwsh
        run: |
          $cli = Join-Path $env:RUNNER_TEMP 'vpkedit/vpkeditcli'
          ./tests/test_mapped_packaging.ps1 -VpkEditCli $cli

      - name: Build VPK v1 and write checksums
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = Join-Path $env:RUNNER_TEMP 'vpkedit/vpkeditcli'
          $directory = Join-Path $env:GITHUB_WORKSPACE 'bin/ci-package'
          $commit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve source commit' }
          "commit=$commit" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          # Both entries explicitly package only: runners must never deploy.
          ./scripts/Build-LvVpk.ps1 -PackageOnly -OutputPath (Join-Path $directory 'pak02_dir.vpk') -VpkEditCli $cli
          ./deploy_multiplayer.ps1 -PackageOnly -OutputPath (Join-Path $directory 'pak03_dir.vpk') -VpkEditCli $cli
          foreach ($name in @('pak02_dir.vpk', 'pak03_dir.vpk')) {
            $output = Join-Path $directory $name
            $package = Get-Item -LiteralPath $output
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $output).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText((Join-Path $directory "$name.sha256"), "$hash  $name`n")
            $info = [ordered]@{
              commit = $commit
              ref = $env:GITHUB_REF
              run_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
              built_at = [DateTime]::UtcNow.ToString('o')
              vpkedit_tag = $env:VPKEDIT_TAG
              vpk_version = 1
              package = $name
              size_bytes = $package.Length
              sha256 = $hash
            }
            $info | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $directory "$name.build-info.json") -Encoding utf8
            "### $name`n- Commit: $commit`n- VPK v1, CRC and payload SHA256 verified`n- SHA256: $hash" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload verified package
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: overforged-vpk-${{ steps.package.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bin/ci-package/pak02_dir.vpk
            bin/ci-package/pak02_dir.vpk.sha256
            bin/ci-package/pak02_dir.vpk.build-info.json
            bin/ci-package/pak03_dir.vpk
            bin/ci-package/pak03_dir.vpk.sha256
            bin/ci-package/pak03_dir.vpk.build-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish Release
    needs: package
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_test && needs.package.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Select build and prepare release notes
        id: source
        env:
          MANUAL_ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Peel annotated tags too: compare commit IDs, not tag object IDs.
          commit="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            python scripts/release_vpk.py prepare-test \
              --tag "test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --run-id "$GITHUB_RUN_ID" --artifact-id "$MANUAL_ARTIFACT_ID" \
              --commit "$commit" --repository "$GITHUB_REPOSITORY" \
              --notes bin/release-notes.md --github-output "$GITHUB_OUTPUT"
          else
            python scripts/release_vpk.py prepare \
              --tag "$VERSION_TAG" --commit "$commit" \
              --repository "$GITHUB_REPOSITORY" \
              --notes bin/release-notes.md --github-output "$GITHUB_OUTPUT"
          fi

      - name: Download selected artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: bin/release-package
          merge-multiple: true

      - name: Verify artifact matches tagged commit and checksum
        run: |
          python scripts/release_vpk.py verify \
            --directory bin/release-package \
            --commit "$(git rev-parse HEAD)"

      - name: Publish GitHub Release
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          options=()
          tag_options=(--verify-tag)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            # Unique test tags are created on the exact build commit, not the branch tip.
            tag_options=(--target "$(git rev-parse HEAD)")
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease --latest=false)
          fi
          # Formal version tags must exist; manual test tags are created above.
          # Existing published releases are never overwritten.
          gh release create "$RELEASE_TAG" --draft \
            --repo "$GITHUB_REPOSITORY" "${tag_options[@]}" \
            --title "$RELEASE_TAG" --notes-file bin/release-notes.md \
            "${options[@]}" \
            bin/release-package/pak02_dir.vpk \
            bin/release-package/pak02_dir.vpk.sha256 \
            bin/release-package/pak02_dir.vpk.build-info.json \
            bin/release-package/pak03_dir.vpk \
            bin/release-package/pak03_dir.vpk.sha256 \
            bin/release-package/pak03_dir.vpk.build-info.json
          # Publish only after all six attachments have finished uploading.
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false "${options[@]}"
